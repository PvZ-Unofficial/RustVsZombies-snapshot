[package]
name = "rsvz-abi-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PvZ 1.0.0.1051 ABI wrapper and call macros"

[lib]
proc-macro = true

[features]
verify-exe = ["dep:iced-x86", "dep:sha2"]

[dependencies]
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "instr_info"], optional = true }
proc-macro2 = "1.0"
quote = "1.0"
sha2 = { version = "0.10", optional = true }
syn = { version = "2.0", features = ["full"] }

[dev-dependencies]
trybuild = "1.0"

[lints]
workspace = true

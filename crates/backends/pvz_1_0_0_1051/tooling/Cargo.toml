[package]
name = "rsvz-backend-1051-tooling"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Build recipe helpers for the PvZ 1.0.0.1051 backend tooling"

[lib]
name = "rsvz_backend_1051_tooling"

[dependencies]
anyhow = "1"
cargo_metadata = "0.19"
clap.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true

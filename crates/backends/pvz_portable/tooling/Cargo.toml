[package]
name = "rsvz-pvz-portable-tooling"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Build and run tooling for the RustVsZombies PvZ-Portable backend"

[dependencies]
anyhow = "1"
cargo_metadata = "0.19"
clap.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[lints]
workspace = true

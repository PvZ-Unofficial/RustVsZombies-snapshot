[package]
name = "rsvz-witness"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"
publish = false
description = "Optional deterministic cross-backend Witness extension for RustVsZombies"

[features]
default = []
capture = []
tooling = ["dep:clap"]

[dependencies]
base64 = "0.22"
clap = { version = "4.6.1", default-features = false, features = ["std", "derive", "help", "usage", "error-context"], optional = true }
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
rsvz = { path = "../../crates/scripting/api", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
rsvz = { path = "../../crates/scripting/api", default-features = false, features = ["pvz-emulator"] }
rsvz-pvz-emulator-backend = { path = "../../crates/backends/pvz_emulator/backend" }

[[bin]]
name = "witness-diff"
path = "src/bin/witness-diff.rs"
required-features = ["tooling"]

[workspace]
resolver = "3"
